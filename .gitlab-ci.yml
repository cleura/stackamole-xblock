image: python
before_script:
  - pip install tox

py311:
  image: python:3.11
  stage: build
  script:
    - tox -e py311-flake8,py311-pipdeptree,py311-pipdeptree-requirements,py311-xblock50-celery5
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py312:
  image: python:3.12
  stage: build
  script:
    - tox -e py312-flake8,py312-pipdeptree,py312-pipdeptree-requirements,py312-xblock50-celery5,py312-xblock60-celery5
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py313:
  image: python:3.13
  stage: build
  script:
    - pip install tox
    - tox -e py313-flake8,py312-pipdeptree,py312-pipdeptree-requirements,py312-xblock50-celery5
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py314:
  image: python:3.14
  stage: build
  script:
    - pip install tox
    - tox -e py314-flake8,py312-pipdeptree,py312-pipdeptree-requirements,py312-xblock50-celery5
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

coverage:
  stage: test
  script:
    - tox -e coverage
    - mv htmlcov public
  coverage: '/TOTAL.*\s+(\d+\.\d+%)$/'
  artifacts:
    paths:
      - public
    expire_in: 1 week
  pages:
    path_prefix: "$CI_COMMIT_BRANCH"
    expire_in: 1 week
